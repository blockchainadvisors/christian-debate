services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: christian_debate
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d christian_debate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/var/lib/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  site:
    build:
      context: .
      dockerfile: packages/site/Dockerfile
    environment:
      DATABASE_URL: postgresql://agora:${POSTGRES_PASSWORD}@postgres:5432/christian_debate
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - site
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
