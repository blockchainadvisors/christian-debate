worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Upstreams
    upstream site_backend {
        server site:3000;
    }

    upstream hub_backend {
        server hub:4000;
    }

    # ── HTTP → HTTPS redirect (uncomment when TLS is configured) ──────────
    # server {
    #     listen 80;
    #     server_name site.yourdomain.com hub.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ── Site ──────────────────────────────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl http2;
        server_name site.yourdomain.com;

        # TLS (uncomment and set paths when certificates are available)
        # ssl_certificate     /etc/nginx/certs/site.crt;
        # ssl_certificate_key /etc/nginx/certs/site.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;

        limit_req zone=general burst=50 nodelay;

        location / {
            proxy_pass http://site_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Hub ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl http2;
        server_name hub.yourdomain.com;

        # TLS (uncomment and set paths when certificates are available)
        # ssl_certificate     /etc/nginx/certs/hub.crt;
        # ssl_certificate_key /etc/nginx/certs/hub.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;

        limit_req zone=general burst=50 nodelay;

        location / {
            proxy_pass http://hub_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
